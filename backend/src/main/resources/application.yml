spring:
  application:
    name: unisphere-nepal
  jackson:
    serialization:
      fail-on-empty-beans: false
  
  # Database Configuration (Neon PostgreSQL database connection setup)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/unisphere_nepal}
    username: ${SPRING_DATASOURCE_USERNAME:unisphere_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Automatic SQL migration execution setup
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: file:../database/migrations/0001_initial_schema.sql
      continue-on-error: true # Ensure startup succeeds if schema elements already exist
  
  # JPA & Hibernate Configurations for PostgreSQL
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379

# Logging Settings
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# Custom Application Config Properties
app:
  jwt:
    secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    expiration-ms: 900000        # 15 minutes (900,000 ms)
    refresh-expiration-ms: 604800000 # 7 days (604,800,000 ms)
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:unisphere_mock_cloud}
    api-key: ${CLOUDINARY_API_KEY:123456789}
    api-secret: ${CLOUDINARY_API_SECRET:mock_secret}
