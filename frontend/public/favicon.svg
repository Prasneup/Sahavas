<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded square background with warm cream tone -->
  <rect width="512" height="512" rx="128" fill="#FAF6EC" />
  
  <!-- Outer circle pattern / Nivaro Mandala -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#E8A33D" stroke-width="20" stroke-dasharray="20, 20" />
  
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#E8A33D" stroke-width="12" />
  
  <!-- Center symbol: stylized house with sun rays -->
  <!-- Sun Center -->
  <circle cx="256" cy="256" r="48" fill="#E8A33D" />
  
  <!-- House silhouette inside the sun/center -->
  <path d="M226 270 L256 240 L286 270 L286 295 L226 295 Z" fill="#FAF6EC" />
  <rect x="248" y="275" width="16" height="20" rx="4" fill="#E8A33D" />
</svg>
