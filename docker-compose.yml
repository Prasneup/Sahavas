version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: unisphere_db
    environment:
      POSTGRES_USER: unisphere_admin
      POSTGRES_PASSWORD: admin_password_123
      POSTGRES_DB: unisphere_nepal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unisphere_admin -d unisphere_nepal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unisphere_cache
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
